name: Phase 16 full-container SD recovery-journal rehearsal
on:
  push:
    branches: [feature/phase16-recovery-journal-rehearsal]
    paths:
      - 'phase16/**'
      - '.github/workflows/phase16-recovery-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  host:
    name: Host full-container journal/restart/corruption and inherited safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Full journal/reopen/corruption/restart tests with MAC double
        run: bash phase16/run_tests.sh
      - name: Prohibit live writes or private files
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'constexpr bool LiveWritesEnabled = false;' phase14/authenticated_restore.hpp
          if grep -En 'FSPXI_WriteFile|FS_OPEN_WRITE.*GBA|LiveWritesEnabled = true' phase16/{main.cpp,rehearsal.hpp,native_store.hpp}; then exit 1; fi
          if git ls-files | grep -Ei '\.(sav|cia|gba|rom|3ds)$'; then exit 1; fi
  native:
    name: devkitPro builds a real 3DSX and ELF with game writes blocked
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native read-only hardware probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          dkp-pacman -S --noconfirm --needed 3ds-dev 3dstools
          mkdir -p phase16-build/source phase16-build/include/vendor
          curl -fLsS -o phase16-build/Makefile https://raw.githubusercontent.com/devkitPro/3ds-examples/master/templates/application/Makefile
          sed -i 's/-fno-exceptions//g;s/-std=gnu++11/-std=gnu++17/g' phase16-build/Makefile
          sed -i 's/TARGET\s*:=\s*$(notdir $(CURDIR))/TARGET := PKSMRoguePhase16RO/g' phase16-build/Makefile
          printf '\nNO_SMDH := 1\nAPP_TITLE := PKSM Rogue Phase16 Journal Test\n' >> phase16-build/Makefile
          cp phase16/main.cpp phase16-build/source/main.cpp
          cp phase11/rogue_svc.s phase16-build/source/rogue_svc.s
          cp phase14/vendor/sha256.c phase16-build/source/sha256.c
          cp phase14/vendor/sha256.h phase16-build/include/vendor/sha256.h
          cp phase14/vendor/sha256.h phase16-build/include/sha256.h
          cp phase15/diagnostic.hpp phase16-build/include/
          cp phase16/rehearsal.hpp phase16/native_store.hpp phase16-build/include/
          cp phase14/authenticated_restore.hpp phase14/native_pxi.hpp phase14/native_journal.hpp phase14/journal_codec.hpp phase16-build/include/
          cp phase11/live_header.hpp phase16-build/include/
          cp phase13/restore_preflight.hpp phase16-build/include/
          cp phase10/preview/offline.hpp phase16-build/include/
          make -C phase16-build -j2
          test -s phase16-build/PKSMRoguePhase16RO.3dsx
          test -s phase16-build/PKSMRoguePhase16RO.elf
          if arm-none-eabi-nm -u phase16-build/build/main.o | grep FSPXI_WriteFile; then
            echo 'ERROR: unexpected privileged write symbol in Phase16 main'; exit 1
          fi
          sha256sum phase16-build/PKSMRoguePhase16RO.{3dsx,elf} > phase16-build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase16-H168-READONLY-JOURNAL-3DSX-NOT-RELEASE
          path: |
            phase16-build/PKSMRoguePhase16RO.3dsx
            phase16-build/PKSMRoguePhase16RO.elf
            phase16-build/SHA256SUMS.txt
          retention-days: 7
  azahar:
    name: Azahar 3DSX launch smoke - does not call privileged PxiFS0
    needs: [host,native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase16-H168-READONLY-JOURNAL-3DSX-NOT-RELEASE
          path: binary
      - name: Launch read-only UI in Azahar (Y not pressed)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool openbox imagemagick mesa-utils libgl1-mesa-dri libegl1 libopengl0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libfuse2t64
          curl -fLsS --retry 3 -o azahar.AppImage https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage
          echo 'af037f8b775198f636b14bcfe63fb401b02246ebfefe1025bb905ce042556960  azahar.AppImage' | sha256sum -c -
          chmod +x azahar.AppImage
          mkdir -p evidence
          export XDG_DATA_HOME="$PWD/isolated-data" XDG_CONFIG_HOME="$PWD/isolated-config"
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 QT_QPA_PLATFORM=xcb
          BIN="$(realpath binary/PKSMRoguePhase16RO.3dsx)"
          export BIN
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -u
            openbox > evidence/wm.log 2>&1 &
            APPIMAGE_EXTRACT_AND_RUN=1 ./azahar.AppImage "$BIN" > evidence/azahar.log 2>&1 &
            pid=$!
            sleep 20
            import -window root evidence/start.png
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          test -s evidence/start.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase16-H168-Azahar-3DSX-boot-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
  package-cia:
    name: Package distinct experimental CIA, no game save writes
    needs: [host,native,azahar]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase16-H168-READONLY-JOURNAL-3DSX-NOT-RELEASE
          path: binary
      - name: Package CIA with existing isolated Phase 10 title ID
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS -o /tmp/makerom.zip 'https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip'
          echo '6f36f77946742d2b8286a92d887e845e06d430998ed4a9c4856d8ea2d4eebd6f  /tmp/makerom.zip' | sha256sum -c -
          unzip -qo /tmp/makerom.zip -d /tmp/makerom-tools
          chmod +x /tmp/makerom-tools/makerom
          mkdir -p experimental
          /tmp/makerom-tools/makerom -f cia -o experimental/PKSMRogue-Phase16-JOURNAL-READONLY-NOT-RELEASE.cia \
            -target t -elf binary/PKSMRoguePhase16RO.elf -rsf phase10/preview/rsf \
            -desc app:4 -exefslogo 2>&1 | tee experimental/makerom.log
          test -s experimental/PKSMRogue-Phase16-JOURNAL-READONLY-NOT-RELEASE.cia
          python3 - <<'PY'
          from pathlib import Path
          cia=Path('experimental/PKSMRogue-Phase16-JOURNAL-READONLY-NOT-RELEASE.cia').read_bytes()
          assert cia.count(bytes.fromhex('000400000f73a400'))>=2
          assert bytes.fromhex('0004000007d7ba00') not in cia
          print('PASS Phase16 app ID isolated from Emerald Rogue title')
          PY
          sha256sum experimental/*.cia > experimental/SHA256SUMS.txt
          cat > experimental/READ_ME_FIRST.txt <<'TEXT'
          PKSM Rogue Phase 16 - READ ONLY recovery-journal REHEARSAL.
          CAUTION: SAVES PERSONAL 3DS GAME DATA ON YOUR SD CARD. Do not share.
          LIVE GBA VC title is ONLY opened FS_OPEN_READ. No live restore.
          X = live dual-slot CMAC diagnostic (read-only).
          A then A = create separate, immutable, FULL original container backup
          and Phase14-format rehearsal journal under /3ds/PKSM-Rogue/phase16/.
          Y = after restart, verify both files, CMACs and live unchanged.
          START = exit. Never delete/overwrite the trial record automatically.
          Title 000400000F73A400 (isolated experimental app, NOT the game).
          Prefer Homebrew Launcher 3DSX first.
          A PASS IS NOT PERMISSION TO RESTORE OR INJECT EDITED SAVES.
          Full Phase16 hardware instructions: phase16/README.md.
          TEXT
      - uses: actions/upload-artifact@v4
        with:
          name: phase16-H168-experimental-CIA-READONLY
          path: experimental/
          retention-days: 7

  install-cia:
    name: Isolated Azahar installed-CIA launch smoke, no privileged access
    needs: [package-cia]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase16-H168-experimental-CIA-READONLY
          path: experimental
      - name: Install separate CIA title, run installed content without Y/A
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool openbox imagemagick mesa-utils libgl1-mesa-dri libegl1 libopengl0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libfuse2t64
          curl -fLsS --retry 3 -o azahar.AppImage https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage
          echo 'af037f8b775198f636b14bcfe63fb401b02246ebfefe1025bb905ce042556960  azahar.AppImage' | sha256sum -c -
          chmod +x azahar.AppImage
          mkdir -p evidence
          export XDG_DATA_HOME="$PWD/installed-test" XDG_CONFIG_HOME="$PWD/installed-config"
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 QT_QPA_PLATFORM=xcb
          CIA="$(realpath experimental/PKSMRogue-Phase16-JOURNAL-READONLY-NOT-RELEASE.cia)"
          export CIA
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -u
            openbox > evidence/wm.log 2>&1 &
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 55s ./azahar.AppImage --install "$CIA" > evidence/install.log 2>&1 &
            pid=$!
            sleep 12
            xdotool key Return || true
            wait "$pid" || true
            find installed-test -type f -name "*.app" -printf "%p %s bytes\n" > evidence/installed-files.txt || true
            app=$(find installed-test -type f -name "*.app" -path "*0f73a400*" -print -quit)
            if [ -z "$app" ]; then echo INSTALL_FAILED; exit 4; fi
            app=$(realpath "$app")
            printf "%s\n" "$app" > evidence/installed-path.txt
            APPIMAGE_EXTRACT_AND_RUN=1 ./azahar.AppImage "$app" > evidence/installed-guest.log 2>&1 &
            guest=$!
            sleep 20
            import -window root evidence/installed-start.png || true
            kill "$guest" 2>/dev/null || true
            wait "$guest" 2>/dev/null || true
          '
          test -s evidence/installed-path.txt
          test -s evidence/installed-start.png
          echo 'PASS: standalone Phase16 CIA installed and executed as isolated title'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase16-H168-installed-CIA-Azahar-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
