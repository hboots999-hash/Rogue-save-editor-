name: Rogue read-only host checks
on:
  push:
    branches: ["feature/phase3-rogue-inspect"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge parses conservatively
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iroguesm_core/include -Ibridge \
            bridge/bridge_smoke_test.cpp bridge/rogue_bridge.cpp \
            roguesm_core/source/sector.cpp \
            roguesm_core/source/candidate_profile.cpp \
            roguesm_core/source/observed_profile.cpp \
            -o /tmp/rogue_bridge_smoke
          /tmp/rogue_bridge_smoke
      - name: Compile UI source with host stubs
        run: |
          g++ -std=gnu++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Itests/host_stubs -Ibridge \
            -c pksm_overlay/RogueInspectScreen.cpp -o /tmp/rogue_screen.o
      - name: Test guarded PKSM overlay patch
        run: python3 tests/test_pksm_patch.py
      - name: Test PKSM SD path isolation
        run: python3 tests/test_isolation.py
      - name: Syntax-check integration tool
        run: python3 -m py_compile tools/apply_to_pksm.py

      - name: Fetch pinned PKSM source for actual integration check
        uses: actions/checkout@v4
        with:
          repository: FlagBrew/PKSM
          ref: 9cad15694c1e90cc058ddd285eb68d56c7ad9ac8
          submodules: recursive
          path: upstream_pksm
          persist-credentials: false
      - name: Apply Rogue overlay to actual PKSM source
        run: |
          python3 tools/isolate_pksm.py upstream_pksm
          python3 tools/apply_to_pksm.py upstream_pksm
          ! grep -R -n -F '/3ds/PKSM/' upstream_pksm/3ds/source upstream_pksm/3ds/include upstream_pksm/common/source upstream_pksm/common/include upstream_pksm/core/source upstream_pksm/core/include --include='*.cpp' --include='*.hpp' --include='*.h' --include='*.c' --include='*.tcc' | grep -v '/3ds/PKSM-Rogue/'
          grep -q 'RogueInspectScreen' upstream_pksm/3ds/source/gui/screen/TitleLoadScreen.cpp
          grep -q 'source/rogue' upstream_pksm/3ds/Makefile
          test -f upstream_pksm/3ds/source/gui/screen/RogueInspectScreen.cpp
