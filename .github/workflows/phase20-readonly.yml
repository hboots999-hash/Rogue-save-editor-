name: Phase20 combined READ-ONLY integration (synthetic, no installed-save writes)
on:
  push:
    branches: [feature/phase20-readonly-integration]
  pull_request:
    paths:
      - 'phase20/**'
      - '.github/workflows/phase20-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-host:
    name: P17 ABI + P18 parser + P19 viewer, strict and ASan/UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: e3fd4971071de91285a4c42b3717b1d1f70999e9
          path: dependencies/phase17
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9569c2ac3f7693ee9d9bed5b30a84f79cb8c2d91
          path: dependencies/phase18
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: e0b19c562b9b2ddf7148e01ecb84a88f1d04c921
          path: dependencies/phase19
      - name: Confirm pinned source revisions and no private inputs
        shell: bash
        run: |
          set -euo pipefail
          for p in phase17 phase18 phase19; do git -C dependencies/$p rev-parse HEAD; done
          if git ls-files phase20 | grep -Ei '\.(sav|gba|rom|cia|3ds|3dsx|elf)$'; then
            echo 'FAIL: binary, save or ROM tracked'; exit 1
          fi
          if grep -En 'rogue18::propose\(|FSUSER_|FSPXI_|FSFILE_Write|AGBSAVE|ARCHIVE_USER_SAVEDATA|fwrite\(' phase20/main.cpp phase20/read_only_v1.hpp; then
            echo 'FAIL: forbidden mutation/native save operation in Phase20'; exit 1
          fi
          grep -Fq 'std::fopen(phase19::OfflineImportPath,"rb")' phase20/read_only_v1.hpp
      - name: Compile and run combined host contract twice (strict, sanitizers)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase20
          for mode in strict sanitized; do
            if [ "$mode" = strict ]; then
              FLAGS="-O2"
            else
              FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie"
            fi
            g++ -std=c++17 $FLAGS -Wall -Wextra -Wpedantic -Werror \
              -I. -Idependencies/phase17/phase17 \
              -Idependencies/phase18 -Idependencies/phase18/phase18 \
              -Idependencies/phase19 -Idependencies/phase19/phase19 \
              phase20/test_read_only_v1.cpp \
              dependencies/phase17/phase17/readonly_status_v1.cpp \
              -o /tmp/phase20/$mode
            ASAN_OPTIONS=detect_leaks=1 /tmp/phase20/$mode
          done
  native-3ds:
    name: Phase20 combined ARM11 3DSX/ELF (no hardware)
    needs: [combined-host]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: e3fd4971071de91285a4c42b3717b1d1f70999e9
          path: dependencies/phase17
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9569c2ac3f7693ee9d9bed5b30a84f79cb8c2d91
          path: dependencies/phase18
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: e0b19c562b9b2ddf7148e01ecb84a88f1d04c921
          path: dependencies/phase19
      - name: Assemble and build combined native preview in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          dkp-pacman -S --noconfirm --needed 3ds-dev 3dstools
          mkdir -p phase20-build/source phase20-build/include/phase18 phase20-build/include/phase19 phase20-build/include/phase20
          curl -fLsS --retry 3 -o phase20-build/Makefile \
            https://raw.githubusercontent.com/devkitPro/3ds-examples/master/templates/application/Makefile
          sed -i 's/-fno-exceptions//g;s/-std=gnu++11/-std=gnu++17/g' phase20-build/Makefile
          sed -i 's/TARGET\s*:=\s*$(notdir $(CURDIR))/TARGET := PKSMRoguePhase20/g' phase20-build/Makefile
          printf '\nNO_SMDH := 1\nAPP_TITLE := PKSM Rogue Phase 20 Read Only\n' >> phase20-build/Makefile
          cp phase20/main.cpp phase20-build/source/main.cpp
          cp dependencies/phase17/phase17/readonly_status_v1.cpp phase20-build/source/readonly_status_v1.cpp
          cp dependencies/phase17/phase17/readonly_status_v1.h phase20-build/include/
          cp phase20/{read_only_v1.hpp,compat_phase19_v1.hpp} phase20-build/include/phase20/
          cp dependencies/phase19/phase19/{adapter.hpp,ui.hpp,screen_text.hpp,rosalina_input.hpp,read_only_import.hpp} phase20-build/include/phase19/
          cp dependencies/phase19/phase19/{adapter.hpp,ui.hpp,screen_text.hpp,rosalina_input.hpp,read_only_import.hpp} phase20-build/include/
          cp dependencies/phase18/phase18/*.hpp phase20-build/include/phase18/
          make -C phase20-build -j2
          test -s phase20-build/PKSMRoguePhase20.3dsx
          test -s phase20-build/PKSMRoguePhase20.elf
          arm-none-eabi-nm -C phase20-build/PKSMRoguePhase20.elf > phase20-build/ELF_SYMBOLS.txt
          # LTO and inlining may erase harmless read-only C++ symbol names.
          # Verify the wired call in source and linked executable existence,
          # while still rejecting any forbidden mutation symbols below.
          grep -Fq 'phase20::inspectFixedSDCopy(active,observation,reason)' phase20/main.cpp
          grep -Fq 'p17_readonly_status_init_blocked_v1' phase20/main.cpp
          test -s phase20-build/ELF_SYMBOLS.txt
          if grep -E 'rogue18::propose\(|nativeSdmcCreateAndWrite|FSFILE_Write\(' phase20-build/ELF_SYMBOLS.txt; then
            echo 'FAIL: unexpected offline proposal or save write symbol'; exit 1
          fi
          sha256sum phase20-build/PKSMRoguePhase20.{3dsx,elf} > phase20-build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase20-3DSX-ELF-READONLY-EXPERIMENTAL
          path: |
            phase20-build/PKSMRoguePhase20.3dsx
            phase20-build/PKSMRoguePhase20.elf
            phase20-build/SHA256SUMS.txt
          retention-days: 7
  experimental-cia:
    name: Isolated Phase20 CIA metadata and package (not release)
    needs: [native-3ds]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase20-3DSX-ELF-READONLY-EXPERIMENTAL
          path: binary
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: e0b19c562b9b2ddf7148e01ecb84a88f1d04c921
          path: dependencies/phase19
      - name: Package separate, explicitly non-writing title and verify IDs
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          echo '6f36f77946742d2b8286a92d887e845e06d430998ed4a9c4856d8ea2d4eebd6f  /tmp/makerom.zip' | sha256sum -c -
          unzip -qo /tmp/makerom.zip -d /tmp/makerom-tools
          chmod +x /tmp/makerom-tools/makerom
          mkdir -p experimental
          sed 's/0xF73A5/0xF73A7/;s/Phase 19/Phase 20/;s/PRU1/PRU2/' \
            dependencies/phase19/phase19/rsf > experimental/phase20.rsf
          # Note: Phase19 dependency is checked out below to guarantee pinned RSF.
          /tmp/makerom-tools/makerom -f cia \
            -o experimental/PKSMRogue-Phase20-READONLY-NOT-RELEASE.cia \
            -target t -elf binary/PKSMRoguePhase20.elf -rsf experimental/phase20.rsf \
            -desc app:4 -exefslogo
          test -s experimental/PKSMRogue-Phase20-READONLY-NOT-RELEASE.cia
          python3 - <<'PY'
          from pathlib import Path
          raw=Path("experimental/PKSMRogue-Phase20-READONLY-NOT-RELEASE.cia").read_bytes()
          assert raw.count(bytes.fromhex("000400000f73a700"))>=2
          for old in ("0004000007d7ba00","000400000f73a400","000400000f73a500","000400000f73a600"):
              assert bytes.fromhex(old) not in raw, old
          print("PASS: isolated Phase20 preview title; no game-title replacement")
          PY
          sha256sum experimental/*.cia > experimental/SHA256SUMS.txt
          printf '%s\n' \
            'NOT FOR INSTALLATION AS A RELEASE. PHASE20 READONLY EXPERIMENT.' \
            'Separate title 000400000F73A700. No installed-save writer.' \
            'Only reads fixed 128KiB offline SD copy after A confirmation.' \
            'Phase17 status defaults NOT CHECKED. No producer/live access.' \
            'ROM identity and game-edit safety unverified.' \
            > experimental/READ_ME_FIRST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase20-CIA-READONLY-NOT-RELEASE
          path: experimental/
          retention-days: 7
