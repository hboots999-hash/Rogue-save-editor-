name: Phase18 Synthetic Move Research (NO ROM UNLOCK)
on:
  push:
    branches: [feature/phase18-move-replacement-research]
  pull_request:
    paths:
      - 'phase18/move_replacement_v1.hpp'
      - 'phase18/test_move_replacement_v1.cpp'
      - 'phase18/native_move_v1_compile.cpp'
      - 'phase18/move_replacement_v2.hpp'
      - 'phase18/move_queue_v4.hpp'
      - 'phase18/test_move_replacement_v2.cpp'
      - 'phase18/native_move_v2_compile.cpp'
      - 'phase18/MOVE_REPLACEMENT_RESEARCH.md'
      - '.github/workflows/phase18-move-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    name: Strict and sanitized C++17 synthetic-only tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, run, and independently check forbidden operations
        shell: bash
        run: |
          set -euo pipefail
          for mode in strict asan; do
            flags="-std=c++17 -Wall -Wextra -Werror -pedantic -g -O2"
            if [ "$mode" = asan ]; then
              flags="-std=c++17 -Wall -Wextra -Werror -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
            fi
            g++ $flags -DROGUE18_SYNTHETIC_MOVE_TEST -Iphase18 phase18/test_move_replacement_v1.cpp -o /tmp/move-test
            /tmp/move-test
            g++ $flags -DROGUE18_TEST_MOVE_V2 -Iphase18 phase18/test_move_replacement_v2.cpp -o /tmp/move-v2-test
            /tmp/move-v2-test /tmp/phase18_synthetic_move_v2_$mode.sav
            python3 -c "import sys; sys.path.insert(0,'phase9/tools'); from inspect_gbavc_save import inspect_bytes; from pathlib import Path; x=inspect_bytes(Path(sys.argv[1]).read_bytes()); assert_all=lambda p: (_ for _ in ()).throw(AssertionError()) if not p else None; assert_all(x['read_only'] and x['bytes']==131072); assert_all(all(s['sectors_checksum_valid']==14 for s in x['banks'])); assert_all(x['current']['party_count']==6); m=x['current']['party'][0]; assert_all(m['checksum_valid'] and m['move_ids'][2]==600 and m['move_pp'][2]==15); print('PASS independent Phase9 checksums/new move ID/PP')" "/tmp/phase18_synthetic_move_v2_$mode.sav"
          done
          grep -F 'constexpr bool ExactRomMoveTableApproved=false' phase18/move_replacement_v1.hpp
          grep -F 'return blocked("Move replacement locked:' phase18/move_replacement_v1.hpp
          python3 -m py_compile phase18/tools/extract_2_1_2_move_catalog.py
          python3 phase18/tools/test_exact_rom_catalog.py
          test ! -f phase18/*.sav
          test ! -f phase18/*.gba
  native:
    name: ARM11 devkitARM synthetic engine compile and stack proof
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development headers
        run: |
          set -eu
          dkp-pacman -S --noconfirm --needed 3ds-dev
      - name: ARM11 C++ compile and link-symbol audit
        run: |
          set -eu
          "$DEVKITARM/bin/arm-none-eabi-g++" -std=gnu++17 -O2 -Wall -Wextra -Werror -Werror=frame-larger-than=4096 -fstack-usage -march=armv6k -mtune=mpcore -mfloat-abi=hard -mfpu=vfp -I"$DEVKITPRO/libctru/include" -Iphase18 -D__3DS__ -DROGUE18_SYNTHETIC_MOVE_TEST -c phase18/native_move_v1_compile.cpp -o /tmp/move-native.o
          "$DEVKITARM/bin/arm-none-eabi-g++" -std=gnu++17 -O2 -Wall -Wextra -Werror -Werror=frame-larger-than=4096 -fstack-usage -march=armv6k -mtune=mpcore -mfloat-abi=hard -mfpu=vfp -I"$DEVKITPRO/libctru/include" -Iphase18 -D__3DS__ -DROGUE18_TEST_MOVE_V2 -c phase18/native_move_v2_compile.cpp -o /tmp/move-v2-native.o
          test -s /tmp/move-v2-native.o
          test -s /tmp/move-native.o
          "$DEVKITARM/bin/arm-none-eabi-nm" -u /tmp/move-native.o > /tmp/move-symbols.txt
          if grep -E 'FSPXI_|svcBackdoor|FSUSER_' /tmp/move-symbols.txt; then
            echo "Installed-game save symbol forbidden"; exit 1
          fi
          test -s /tmp/move-native.su
          test -s /tmp/move-v2-native.su
          python3 - <<'PY'
          frames=[]
          for filename in ['/tmp/move-native.su','/tmp/move-v2-native.su']:
            for line in open(filename):
                parts=line.rstrip().rsplit(chr(9),2)
                if len(parts)==3:
                    try: frames.append((int(parts[1]),parts[0]))
                    except ValueError: pass
          assert frames, "No ARM11 frame evidence"
          size,name=max(frames)
          print("Largest compiled ARM11 frame:",size,name)
          assert size<=4096
          PY
