name: PKSM native 3DS compile (experimental)
on:
  workflow_dispatch:
  push:
    branches: [feature/phase3-rogue-inspect]
    paths:
      - "bridge/**"
      - "roguesm_core/**"
      - "pksm_overlay/**"
      - "tools/apply_to_pksm.py"
      - "tools/isolate_pksm.py"
      - "tools/restrict_startup.py"
      - ".github/workflows/native-pksm-build.yml"
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - name: Fetch Rogue code
        uses: actions/checkout@v4
        with:
          path: rogue
          persist-credentials: false
      - name: Fetch pinned PKSM including submodules
        uses: actions/checkout@v4
        with:
          repository: FlagBrew/PKSM
          ref: 9cad15694c1e90cc058ddd285eb68d56c7ad9ac8
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Check native prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          echo "DEVKITPRO=$DEVKITPRO DEVKITARM=$DEVKITARM"
          export PATH="$DEVKITARM/bin:$PATH"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          arm-none-eabi-g++ --version | head -1
          python3 --version
          for cmd in make rsync tex3ds 3dstool makerom bannertool; do
            command -v "$cmd" || echo "MISSING OPTIONAL: $cmd"
          done
          python3 -c 'import git; print("GitPython installed")' || true
      - name: Isolate inherited PKSM SD paths before overlay
        shell: bash
        run: |
          set -euxo pipefail
          python3 rogue/tools/isolate_pksm.py upstream
          git -C upstream diff --check
      - name: Apply isolated read-only Rogue screen
        shell: bash
        run: |
          set -euxo pipefail
          python3 rogue/tools/apply_to_pksm.py upstream
          git -C upstream diff --check
          grep -q 'RogueInspectScreen' upstream/3ds/source/gui/screen/TitleLoadScreen.cpp
      - name: Restrict inherited PKSM save scans and updater
        shell: bash
        run: |
          set -euxo pipefail
          python3 rogue/tools/restrict_startup.py upstream
          git -C upstream diff --check
          grep -q 'const bool contentUp = rogueInspectOnly' upstream/3ds/source/app.cpp
      - name: Compile modified PKSM ELF using devkitARM (packaging tools absent)
        shell: bash
        run: |
          set -o pipefail
          cd upstream
          make revision 2>&1 | tee ../native_build.log
          make -C 3ds -j2 buildelf PKSM_TITLE="PKSM Rogue Inspect" PKSM_AUTHOR="FlagBrew" PKSM_DESCRIPTION="Pokemon Rogue read-only inspector" VERSION_MAJOR=10 VERSION_MINOR=4 VERSION_MICRO=2 2>&1 | tee -a ../native_build.log
      - name: Attempt separate experimental 3DSX packaging
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cd upstream
          make -C 3ds -j2 "$PWD/3ds/out/PKSM_Rogue_Inspect.3dsx" _ROMFS_DEPS="../assets/romfs/i18n ../assets/romfs/personal" PKSM_TITLE="PKSM Rogue Inspect" PKSM_AUTHOR="FlagBrew" PKSM_DESCRIPTION="Pokemon Rogue read-only inspector" VERSION_MAJOR=10 VERSION_MINOR=4 VERSION_MICRO=2 2>&1 | tee -a ../native_build.log
      - name: Archive unverified development executables (DO NOT INSTALL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do-not-install-experimental-pksm-rogue
          path: |
            upstream/3ds/out/*.elf
            upstream/3ds/out/*.3dsx
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize native compilation
        if: always()
        shell: bash
        run: |
          {
            echo "## Experimental native build"
            echo "Pinned upstream commit: 9cad15694c1e90cc058ddd285eb68d56c7ad9ac8"
            echo "This is not an emulator or hardware test, nor proof of installed-save safety."
            if test -f native_build.log; then echo '### Final compiler output'; tail -n 70 native_build.log; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build logs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-native-build-log
          path: native_build.log
          if-no-files-found: ignore
          retention-days: 7
