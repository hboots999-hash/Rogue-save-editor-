name: PKSM Rogue Phase 9.4 — configurable synthetic editor regressions
on:
  push:
    branches: [feature/phase7-native-ci]
    paths:
      - 'phase9/offline_sandbox.hpp'
      - 'phase9/test_offline_sandbox.cpp'
      - 'phase9/edit_values.hpp'
      - 'phase9/test_edit_values.cpp'
      - '.github/workflows/phase9-sandbox-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    name: Synthetic-only exporter and backup-gate regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned Phase 7 editor source and build
        shell: bash
        run: |
          set -euo pipefail
          cat phase7/archive/{01,02,03,04,05,06,07}.b64 | tr -d '\r\n' | base64 -d > /tmp/phase7-src.tar.xz
          echo '9d1877a76942d90c5579015349455462bfcc6121469536cccce6346c0a01ed63  /tmp/phase7-src.tar.xz' | sha256sum -c -
          mkdir -p parser-src
          tar -xJf /tmp/phase7-src.tar.xz -C parser-src --no-same-owner
          python3 phase7/create_synthetic_fixture.py /tmp/synthetic_candidate_test.sav
          echo '90c448925a00306cbd4c7ece37c1313a75d02c02170c515a722d8bf0f180e5da  /tmp/synthetic_candidate_test.sav' | sha256sum -c -
          g++ -std=gnu++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iphase9 -Iparser-src/editor -Iparser-src/bridge -Iparser-src/roguesm_core/include phase9/test_offline_sandbox.cpp parser-src/editor/rogue_numeric_edit.cpp parser-src/editor/rogue_pokemon_edit.cpp parser-src/editor/rogue_moves_items_edit.cpp parser-src/bridge/rogue_bridge.cpp parser-src/roguesm_core/source/*.cpp -o /tmp/phase9_sandbox
          /tmp/phase9_sandbox /tmp/synthetic_candidate_test.sav
          g++ -std=gnu++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror -Iphase9 -Iparser-src/editor -Iparser-src/bridge -Iparser-src/roguesm_core/include phase9/test_offline_sandbox.cpp parser-src/editor/rogue_numeric_edit.cpp parser-src/editor/rogue_pokemon_edit.cpp parser-src/editor/rogue_moves_items_edit.cpp parser-src/bridge/rogue_bridge.cpp parser-src/roguesm_core/source/*.cpp -o /tmp/phase9_sandbox_asan
          ASAN_OPTIONS=detect_leaks=1 /tmp/phase9_sandbox_asan /tmp/synthetic_candidate_test.sav
          g++ -std=gnu++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iphase9 phase9/test_edit_values.cpp -o /tmp/edit_values_test
          /tmp/edit_values_test
          g++ -std=gnu++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror -Iphase9 phase9/test_edit_values.cpp -o /tmp/edit_values_asan
          ASAN_OPTIONS=detect_leaks=1 /tmp/edit_values_asan
      - name: Reject any personal game files in tracked sources
        run: |
          if git ls-files | grep -Ei '\.(sav|cia|gba|3ds|3dsx|rom)$'; then exit 1; fi
