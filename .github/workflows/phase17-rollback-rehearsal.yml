name: Phase 17 memory-only rollback rehearsal from existing Phase 16 journal
on:
  push:
    branches: [feature/phase17-rollback-rehearsal]
    paths:
      - 'phase17/**'
      - 'phase14/**'
      - 'phase15/**'
      - 'phase16/**'
      - 'phase13/**'
      - 'phase11/**'
      - '.github/workflows/phase17-rollback-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  host:
    name: Host in-RAM interruption/restart/rollback and inherited tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: RAM-only transactional restore/rollback and fail-closed tests
        run: bash phase17/run_tests.sh
      - name: Prohibit live writes or private files
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'constexpr bool LiveWritesEnabled = false;' phase14/authenticated_restore.hpp
          if grep -En 'FSPXI_WriteFile|FS_OPEN_WRITE.*GBA|LiveWritesEnabled = true' phase17/{main.cpp,rollback_lab.hpp}; then exit 1; fi
          if git ls-files | grep -Ei '\.(sav|cia|gba|rom|3ds)$'; then exit 1; fi
  abi-boundary:
    name: Versioned C ABI with independently compiled Phase18 consumer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9569c2ac3f7693ee9d9bed5b30a84f79cb8c2d91
          path: dependencies/phase18
      - name: Verify isolated ABI, no duplicated h168 and no writer symbols
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Werror -O2"
          g++ $CXXFLAGS -Iphase17 -c phase17/readonly_status_v1.cpp -o /tmp/status.o
          g++ $CXXFLAGS -Iphase17 -c phase17/installed_save_probe_v1.cpp -o /tmp/saveprobe.o
          g++ $CXXFLAGS -Iphase17 -Idependencies/phase18 \
            -Idependencies/phase18/phase18 \
            -c phase17/test_phase18_abi_boundary.cpp -o /tmp/phase18_consumer.o
          g++ $CXXFLAGS /tmp/phase18_consumer.o /tmp/status.o /tmp/saveprobe.o -o /tmp/phase18_abi
          /tmp/phase18_abi
          nm -C /tmp/status.o | grep -F p17_readonly_status_shape_valid_v1
          if nm -C /tmp/status.o /tmp/saveprobe.o | grep -E 'FSPXI_WriteFile|phase14::execute|phase14::recover|rogue18::propose'; then
            echo 'BLOCK: write/recovery operation referenced by the public ABI' >&2
            exit 1
          fi
          echo 'PASS: public Phase17 ABI can link to pinned Phase18 consumer without header collisions'
  phase20-offline-scope:
    name: Independent pinned Phase20/Phase18 native archive-scope audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 5a79bcbc522ad4e8d37f14bebfa9e7ac12143de2
          path: dependencies/phase20
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3625e160a17f805821098cf35a47a0f96aba8e16
          path: dependencies/phase18
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 96f976232931e42ebcd474888314ad3c9875258e
          path: dependencies/moves
      - name: Validate SD-only import/export scope; no native game writer
        shell: bash
        run: |
          set -euo pipefail
          git -C dependencies/phase20 rev-parse HEAD
          git -C dependencies/phase18 rev-parse HEAD
          git -C dependencies/moves rev-parse HEAD
          bash phase17/audit_phase20_offline_scope.sh \
            dependencies/phase20 dependencies/phase18 dependencies/moves

  native:
    name: devkitPro builds a real 3DSX and ELF with game writes blocked
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native read-only hardware probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          dkp-pacman -S --noconfirm --needed 3ds-dev 3dstools
          mkdir -p phase17-build/source phase17-build/include/vendor
          curl -fLsS -o phase17-build/Makefile https://raw.githubusercontent.com/devkitPro/3ds-examples/master/templates/application/Makefile
          sed -i 's/-fno-exceptions//g;s/-std=gnu++11/-std=gnu++17/g' phase17-build/Makefile
          sed -i 's/TARGET\s*:=\s*$(notdir $(CURDIR))/TARGET := PKSMRoguePhase17RO/g' phase17-build/Makefile
          printf '\nNO_SMDH := 1\nAPP_TITLE := PKSM Rogue Phase17 RAM Shadow\n' >> phase17-build/Makefile
          cp phase17/main.cpp phase17-build/source/main.cpp
          cp phase11/rogue_svc.s phase17-build/source/rogue_svc.s
          cp phase14/vendor/sha256.c phase17-build/source/sha256.c
          cp phase14/vendor/sha256.h phase17-build/include/vendor/sha256.h
          cp phase14/vendor/sha256.h phase17-build/include/sha256.h
          cp phase15/diagnostic.hpp phase17-build/include/
          cp phase16/rehearsal.hpp phase16/native_store.hpp phase17-build/include/
          cp phase17/rollback_lab.hpp phase17-build/include/
          cp phase14/authenticated_restore.hpp phase14/native_pxi.hpp phase14/native_journal.hpp phase14/journal_codec.hpp phase17-build/include/
          cp phase11/live_header.hpp phase17-build/include/
          cp phase13/restore_preflight.hpp phase17-build/include/
          cp phase10/preview/offline.hpp phase17-build/include/
          make -C phase17-build -j2
          test -s phase17-build/PKSMRoguePhase17RO.3dsx
          test -s phase17-build/PKSMRoguePhase17RO.elf
          # Cross-compile the versioned read-only C status ABI separately.
          # Static layout checks run for ARM11 as well as x86 host consumers.
          arm-none-eabi-g++ -std=gnu++17 -Wall -Wextra -Wpedantic -Werror \
            -march=armv6k -mtune=mpcore -mfloat-abi=hard -mfpu=vfp \
            -Iphase17 -c phase17/readonly_status_v1.cpp -o phase17-build/readonly-status-v1.o
          test -s phase17-build/readonly-status-v1.o
          # PKSM Issue #15 private native read-only adapter is compiled in
          # its own translation unit: no Phase18 h168 types and no UI call.
          # The existing Phase17 3DSX is intentionally not given this API
          # until an independently reviewed PKSM UI integration is ready.
          # libctru public headers use GNU extensions (anonymous structs,
          # flexible arrays). Keep -Wall/-Wextra/-Werror, but not -Wpedantic
          # when compiling a TU that includes third-party <3ds.h>.
          arm-none-eabi-g++ -std=gnu++17 -Wall -Wextra -Werror \
            -fexceptions -march=armv6k -mtune=mpcore \
            -mfloat-abi=hard -mfpu=vfp \
            -Iphase17 -Iphase14 -Iphase11 -Iphase13 \
            -Iphase10/preview \
            -c phase17/installed_save_probe_v1.cpp \
            -o phase17-build/installed-save-probe-v1.o
          # libctru public headers use GNU extensions (anonymous structs,
          # flexible arrays). Keep -Wall/-Wextra/-Werror, but not -Wpedantic
          # when compiling a TU that includes third-party <3ds.h>.
          arm-none-eabi-g++ -std=gnu++17 -Wall -Wextra -Werror \
            -fexceptions -march=armv6k -mtune=mpcore \
            -mfloat-abi=hard -mfpu=vfp \
            -I"$DEVKITPRO/libctru/include" \
            -Iphase17 -Iphase14 -Iphase11 -Iphase13 \
            -Iphase10/preview \
            -c phase17/installed_save_probe_native_v1.cpp \
            -o phase17-build/installed-save-probe-native.o
          test -s phase17-build/installed-save-probe-v1.o
          test -s phase17-build/installed-save-probe-native.o
          if arm-none-eabi-nm -u phase17-build/installed-save-probe-native.o | grep FSPXI_WriteFile; then
            echo 'ERROR: optional PKSM read-only probe linked a privileged write symbol' >&2
            exit 1
          fi
          if arm-none-eabi-nm -u phase17-build/build/main.o | grep FSPXI_WriteFile; then
            echo 'ERROR: unexpected privileged write symbol in Phase17 main'; exit 1
          fi
          sha256sum phase17-build/PKSMRoguePhase17RO.{3dsx,elf} > phase17-build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase17-H168-RAM-ROLLBACK-3DSX
          path: |
            phase17-build/PKSMRoguePhase17RO.3dsx
            phase17-build/PKSMRoguePhase17RO.elf
            phase17-build/SHA256SUMS.txt
          retention-days: 7
  azahar:
    name: Azahar 3DSX launch smoke - does not call privileged PxiFS0
    needs: [host,native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase17-H168-RAM-ROLLBACK-3DSX
          path: binary
      - name: Launch read-only UI in Azahar (Y not pressed)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool openbox imagemagick mesa-utils libgl1-mesa-dri libegl1 libopengl0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libfuse2t64
          curl -fLsS --retry 3 -o azahar.AppImage https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage
          echo 'af037f8b775198f636b14bcfe63fb401b02246ebfefe1025bb905ce042556960  azahar.AppImage' | sha256sum -c -
          chmod +x azahar.AppImage
          mkdir -p evidence
          export XDG_DATA_HOME="$PWD/isolated-data" XDG_CONFIG_HOME="$PWD/isolated-config"
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 QT_QPA_PLATFORM=xcb
          BIN="$(realpath binary/PKSMRoguePhase17RO.3dsx)"
          export BIN
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -u
            openbox > evidence/wm.log 2>&1 &
            APPIMAGE_EXTRACT_AND_RUN=1 ./azahar.AppImage "$BIN" > evidence/azahar.log 2>&1 &
            pid=$!
            sleep 20
            import -window root evidence/start.png
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          test -s evidence/start.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-H168-Azahar-3DSX-boot-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
  package-cia:
    name: Package distinct experimental CIA, no game save writes
    needs: [host,native,azahar]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase17-H168-RAM-ROLLBACK-3DSX
          path: binary
      - name: Package independently titled Phase17 CIA (separate from Phase16 and game)
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS -o /tmp/makerom.zip 'https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip'
          echo '6f36f77946742d2b8286a92d887e845e06d430998ed4a9c4856d8ea2d4eebd6f  /tmp/makerom.zip' | sha256sum -c -
          unzip -qo /tmp/makerom.zip -d /tmp/makerom-tools
          chmod +x /tmp/makerom-tools/makerom
          mkdir -p experimental
          /tmp/makerom-tools/makerom -f cia -o experimental/PKSMRogue-Phase17-RAMONLY-NOT-RELEASE.cia \
            -target t -elf binary/PKSMRoguePhase17RO.elf -rsf phase17/rsf \
            -desc app:4 -exefslogo 2>&1 | tee experimental/makerom.log
          test -s experimental/PKSMRogue-Phase17-RAMONLY-NOT-RELEASE.cia
          python3 - <<'PY'
          from pathlib import Path
          cia=Path('experimental/PKSMRogue-Phase17-RAMONLY-NOT-RELEASE.cia').read_bytes()
          assert cia.count(bytes.fromhex('000400000f73a600'))>=2
          assert bytes.fromhex('0004000007d7ba00') not in cia
          print('PASS Phase17 app ID isolated from Emerald Rogue title')
          PY
          sha256sum experimental/*.cia > experimental/SHA256SUMS.txt
          cat > experimental/READ_ME_FIRST.txt <<'TEXT'
          PKSM Rogue Phase 17 - MEMORY-ONLY restoration & rollback test.
          Experimental. NO LIVE GAME WRITES / RESTORE.
          Title 000400000F73A600 (separate from Phase16 preview and game).
          Reads preserved Phase16 private SD journal and installed game ONLY.
          X = verify prior Phase16 journal and full live GBA VC unchanged.
          Y = simulate restoring and rolling back IN RAM only with same
              signed plan; 4 partial-write and 4 interruption scenarios.
          B = clear status. START = exit.
          Never uploads, overwrites, creates or deletes the user's save.
          REQUIRE existing Phase16 original_container.bin and
          rehearsal_only.rec from passing Phase16 hardware test.
          NO REAL RESTORE OR ROLLBACK WILL TAKE PLACE.
          Full instructions in phase17/README.md.
          TEXT
      - uses: actions/upload-artifact@v4
        with:
          name: phase17-H168-experimental-CIA-RAMONLY
          path: experimental/
          retention-days: 7

  install-cia:
    name: Isolated Azahar installed-CIA launch smoke, no privileged access
    needs: [package-cia]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: phase17-H168-experimental-CIA-RAMONLY
          path: experimental
      - name: Install separate CIA title, run installed content without Y/A
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool openbox imagemagick mesa-utils libgl1-mesa-dri libegl1 libopengl0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libfuse2t64
          curl -fLsS --retry 3 -o azahar.AppImage https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage
          echo 'af037f8b775198f636b14bcfe63fb401b02246ebfefe1025bb905ce042556960  azahar.AppImage' | sha256sum -c -
          chmod +x azahar.AppImage
          mkdir -p evidence
          export XDG_DATA_HOME="$PWD/installed-test" XDG_CONFIG_HOME="$PWD/installed-config"
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 QT_QPA_PLATFORM=xcb
          CIA="$(realpath experimental/PKSMRogue-Phase17-RAMONLY-NOT-RELEASE.cia)"
          export CIA
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -u
            openbox > evidence/wm.log 2>&1 &
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 55s ./azahar.AppImage --install "$CIA" > evidence/install.log 2>&1 &
            pid=$!
            sleep 12
            xdotool key Return || true
            wait "$pid" || true
            find installed-test -type f -name "*.app" -printf "%p %s bytes\n" > evidence/installed-files.txt || true
            app=$(find installed-test -type f -name "*.app" -path "*0f73a600*" -print -quit)
            if [ -z "$app" ]; then echo INSTALL_FAILED; exit 4; fi
            app=$(realpath "$app")
            printf "%s\n" "$app" > evidence/installed-path.txt
            APPIMAGE_EXTRACT_AND_RUN=1 ./azahar.AppImage "$app" > evidence/installed-guest.log 2>&1 &
            guest=$!
            sleep 20
            import -window root evidence/installed-start.png || true
            kill "$guest" 2>/dev/null || true
            wait "$guest" 2>/dev/null || true
          '
          test -s evidence/installed-path.txt
          test -s evidence/installed-start.png
          echo 'PASS: standalone Phase17 CIA installed and executed as isolated title'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-H168-installed-CIA-Azahar-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
